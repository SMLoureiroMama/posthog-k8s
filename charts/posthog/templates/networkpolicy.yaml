{{- if .Values.networkPolicy.enabled }}
{{- $selector := include "posthog.selectorLabels" (list . "router") | fromYaml }}
---
# Default deny ingress for every pod of this release; pods of the release may talk to each other.
# The router is left out: the policy below decides who reaches its listeners.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "posthog.fullname" . }}-internal
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "posthog.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "posthog.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
    matchExpressions:
      - {key: app.kubernetes.io/component, operator: NotIn, values: [router]}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "posthog.name" . }}
              app.kubernetes.io/instance: {{ .Release.Name }}
---
# The router's ingest listener is reachable from the release's pods and the configured peers (ingress
# controller, tunnel); the app listener only from appIngressFrom (the identity-aware proxy), which
# does not include the release's own pods. An empty appIngressFrom closes the app listener.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "posthog.fullname" . }}-router
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "posthog.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- toYaml $selector | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "posthog.name" . }}
              app.kubernetes.io/instance: {{ .Release.Name }}
        {{- with .Values.networkPolicy.ingestIngressFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      ports:
        - port: {{ .Values.router.ports.ingest }}
    {{- with .Values.networkPolicy.appIngressFrom }}
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - port: {{ $.Values.router.ports.app }}
    {{- end }}
{{- end }}
